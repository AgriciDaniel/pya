name: Evals

# Model-backed evals cost usage, so they run only on release tags or by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: evals
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without an API key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so the evals were skipped."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run plugin evals
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx --yes @anthropic-ai/claude-code@2.1.309 plugin eval . --scaffold --trust-plugin --no-publish --allow-tools "Bash(python3 -I *)" "Bash(git -C *)" --json results.json --threshold 0.8
